services:
  - type: web
    name: sentinel-paper-worker
    runtime: python
    plan: starter
    buildCommand: pip install -r requirements-worker.txt
    startCommand: uvicorn server:app --host 0.0.0.0 --port $PORT --workers 1
    healthCheckPath: /health
    disk:
      name: sentinel-paper-data
      mountPath: /data
      sizeGB: 1
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.11
      - key: SENTINEL_DB
        value: /data/sentinel.sqlite3
      - key: DASHBOARD_TOKEN
        generateValue: true
      - key: POLL_SECONDS
        value: '15'
      - key: MIN_VOTES
        value: '8'
      - key: MIN_LEAD
        value: '4'
      - key: MIN_ADX
        value: '18'
      - key: MAX_ENTRY_CENTS
        value: '60'
      - key: MAX_SPREAD_CENTS
        value: '8'
      - key: MIN_SECONDS_LEFT
        value: '120'
      - key: PAPER_QTY
        value: '1'
      - key: TP_CENTS
        value: '15'
      - key: SL_CENTS
        value: '10'
